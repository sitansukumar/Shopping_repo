name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI - Continuous Integration
  # =========================
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check HTML file
      - name: Check HTML file
        run: |
          test -f shopping.html
          echo "shopping.html found"

      # 4. Validate HTML
      - name: Validate HTML
        run: |
          grep -q "<html" shopping.html
          grep -q "</html>" shopping.html
          echo "HTML validation successful"


      # 6. CI success
      - name: CI Success
        run: |
          echo "Continuous Integration completed successfully"


  # =========================
  # CD - Continuous Deployment
  # =========================
  deploy:

    runs-on: ubuntu-latest

    needs: build-and-test

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SHOPPING_SECRET }}" > ~/.ssh/ec2-key

          chmod 600 ~/.ssh/ec2-key

          echo "SSH key configured"

      # 3. Test SSH connection
      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/ec2-key \
            -o StrictHostKeyChecking=no \
            sitansu@${{ secrets.SHOPPING_EC2_IP }} \
            "echo SSH connection successful"

      # 4. Copy HTML and CSS files to EC2
      - name: Copy application to EC2
        run: |
          scp \
            -i ~/.ssh/ec2-key \
            -o StrictHostKeyChecking=no \
            shopping.html \
            sitansu@${{ secrets.SHOPPING_EC2_IP }}:/var/www/html/

      # 5. Verify deployment
      - name: Verify deployment
        run: |
          ssh \
            -i ~/.ssh/ec2-key \
            -o StrictHostKeyChecking=no \
            sitansu@${{ secrets.SHOPPING_EC2_IP }} \
            "ls -l /var/www/html/shopping.html

      # 6. Deployment successful
      - name: CD Success
        run: |
          echo "Application deployed successfully to EC2"