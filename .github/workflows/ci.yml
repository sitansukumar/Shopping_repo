name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI JOB
  # =========================
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check HTML file exists
      - name: Check HTML file
        run: |
          test -f shopping.html
          echo "HTML file found"

      # 3. Validate HTML
      - name: Validate HTML
        run: |
          grep -q "<html" shopping.html
          grep -q "</html>" shopping.html
          echo "HTML validation successful"

      # 4. CI completed
      - name: CI Success
        run: echo "Continuous Integration completed successfully"


  # =========================
  # CD JOB
  # =========================
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      # 1. Get the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SHOPPING_SECRET }}" > ~/.ssh/ec2-key
          chmod 600 ~/.ssh/ec2-key

      # 3. Copy shopping.html to EC2
      - name: Copy application to EC2
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2-key \
            shopping.html \
            sitansu@${{ secrets.SHOPPING_EC2_IP }}:/tmp/index.html

      # 4. Replace existing index.html
      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2-key \
            sitansu@${{ secrets.SHOPPING_EC2_IP }} \
            "sudo mv /tmp/index.html /var/www/html/index.html"

      # 5. CD completed
      - name: CD completed
        run: echo "Application deployed successfully to EC2"