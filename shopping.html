<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ffd700;
        }

        .hero {
            background-color: #ddd;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .search-box {
            width: 50%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .products {
            padding: 40px 50px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            height: 180px;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .cart-button {
            background-color: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-button:hover {
            background-color: #444;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 900px) {
            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-box {
                width: 80%;
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .product-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">ShopEasy</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart 🛒</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to ShopEasy</h1>
        <p>Find the best products at the best prices.</p>

        <input
            type="text"
            class="search-box"
            placeholder="Search for products..."
        >
    </section>

    <section class="products">

        <h2>Featured Products</h2>

        <div class="product-container">

            <div class="product">
                <div class="product-image">📱</div>
                <h3>Smartphone</h3>
                <p class="price">₹36,000</p>
                <button class="cart-button">Add to Cart</button>
            </div>

            <div class="product">
                <div class="product-image">💻</div>
                <h3>ACER_Laptop</h3>
                <p class="price">₹59,999</p>
                <button class="cart-button">Add to Cart</button>
            </div>

            <div class="product">
                <div class="product-image">🎧</div>
                <h3>Headphones</h3>
                <p class="price">₹2,499</p>
                <button class="cart-button">Add to Cart</button>
            </div>

            <div class="product">
                <div class="product-image">⌚</div>
                <h3>Smart Watch</h3>
                <p class="price">₹4,999</p>
                <button class="cart-button">Add to Cart</button>
            </div>

        </div>

    </section>

    <footer>
        <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

</body>
</html>
